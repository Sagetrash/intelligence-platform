version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: context_intel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: context_intelligence
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d context_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

